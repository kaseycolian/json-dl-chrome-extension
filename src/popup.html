<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JSON Interceptor</title>
  <!-- Theme service (see theme/THEME-SERVICE.md). theme-init.js must stay external and first:
       it applies the saved theme before paint, and MV3 blocks inline scripts. -->
  <script src="theme/theme-init.js"></script>
  <link rel="stylesheet" href="theme/theme.css">
  <link rel="stylesheet" href="theme/effects.css">
  <link rel="stylesheet" href="theme/components.css">
  <link rel="stylesheet" href="theme/dropdown.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      min-height: 480px;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      font-family: var(--font-ui);
      color: var(--text);
      overflow: hidden;
    }

    /* Keep the bars' neon edge + glow, but on a flat fill: the gradient's tinted
       middle drops the text sitting on them below AA in several themes. */
    .header.fx-bar-top,
    .footer-area.fx-bar-bottom { background: var(--bg-panel); }

    /* Header */
    .header {
      position: relative;
      z-index: 1; /* keep the bar's glow above the status bar */
      padding: 18px 20px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: var(--accent-pink);
      box-shadow: var(--bglow-pink);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--on-pink);
      letter-spacing: -1px;
    }

    .logo-text {
      font-size: 15px;
      font-weight: 800;
      font-style: italic;
      letter-spacing: 1px;
    }

    .logo-text span {
      color: var(--accent-pink);
      text-shadow: var(--tglow-pink);
    }

    /* Master toggle — .switch from components.css, laid out label-first */
    .header .switch { flex-direction: row-reverse; }

    .switch.a-pink input:checked + .track {
      background: var(--accent-pink);
      border-color: var(--accent-pink);
      box-shadow: var(--bglow-pink);
    }

    .switch.a-pink input:checked + .track .thumb { background: var(--on-pink); }

    .toggle-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      transition: color var(--dur);
    }

    .toggle-label.active {
      color: var(--accent-pink);
      text-shadow: var(--tglow-pink-sm);
    }

    /* Status bar */
    .status-bar {
      padding: 8px 20px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-muted);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background var(--dur), box-shadow var(--dur);
    }

    .dot.active {
      background: var(--accent-green);
      box-shadow: var(--bglow-green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .capture-count {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-muted);
    }

    .capture-count span {
      color: var(--accent-pink);
      font-weight: 700;
    }

    /* Body */
    .body {
      padding: 16px 20px;
    }

    .body .field-label {
      display: block;
      margin-bottom: 10px;
    }

    /* Add endpoint */
    .add-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .input-wrap {
      flex: 1;
      min-width: 0;
    }

    .input-wrap .input {
      width: 100%;
      font-family: var(--font-mono);
      font-size: 12px;
    }

    .add-row .btn {
      flex-shrink: 0;
      white-space: nowrap;
    }

    /* Endpoint list */
    .endpoints-wrap {
      max-height: 250px;
      overflow-y: auto;
    }

    .empty-state {
      text-align: center;
      padding: 32px 0;
      color: var(--text-muted);
    }

    .empty-state .empty-icon {
      font-size: 28px;
      margin-bottom: 10px;
      opacity: 0.4;
    }

    .empty-state p {
      font-size: 12px;
      line-height: 1.6;
    }

    .empty-state code {
      font-family: var(--font-mono);
      font-size: 10px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      padding: 2px 5px;
      border-radius: 3px;
      color: var(--accent-pink);
    }

    .endpoint-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px 9px 7px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
      transition: border-color var(--dur) ease;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .endpoint-item:hover { border-color: var(--accent-blue); }

    .endpoint-item.disabled .ep-url { color: var(--text-muted); }

    /* Per-filter on/off: a 24px target around a 14px ring */
    .ep-toggle {
      flex-shrink: 0;
      position: relative;
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
    }

    .ep-toggle::before {
      content: '';
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      border: 2px solid var(--border-strong);
      transition: background var(--dur), border-color var(--dur);
    }

    .ep-toggle:hover::before { border-color: var(--accent-pink); }

    .ep-toggle.on::before {
      border-color: var(--accent-pink);
      background: var(--accent-pink);
      box-shadow: 0 0 calc(6px * var(--glow-strength)) color-mix(in srgb, var(--accent-pink) 55%, transparent);
    }

    .ep-toggle.on::after {
      content: '';
      position: absolute;
      inset: 9px;
      border-radius: 50%;
      background: var(--on-pink);
    }

    .ep-toggle:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .ep-url {
      flex: 1;
      min-width: 0;
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text);
      overflow-x: auto;
      white-space: nowrap;
    }

    /* Thin horizontal take on .fx-scroll for long URLs. The scrollbar is 12px tall but its
       top 6px is a transparent border, so the gap above it only exists when it scrolls. */
    .ep-url.fx-scroll::-webkit-scrollbar { height: 12px; }

    .ep-url.fx-scroll::-webkit-scrollbar-track {
      border-top: 6px solid transparent;
      background-clip: padding-box;
    }

    .ep-url.fx-scroll::-webkit-scrollbar-thumb {
      background: linear-gradient(90deg, var(--accent-pink), var(--accent-purple) 55%, var(--accent-blue));
      border: 1px solid transparent;
      border-top-width: 7px;
      background-clip: padding-box;
      box-shadow: none;
    }

    .ep-url .match-type {
      font-size: 9px;
      padding: 1px 6px;
      margin-right: 5px;
      vertical-align: 1px;
    }

    .ep-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .ep-actions .btn-icon {
      width: 24px;
      height: 24px;
      font-size: 12px;
    }

    /* Click-to-peek box showing a filter's full URL (same pattern as url-maker).
       A manual popover, so it sits in the top layer over the popup instead of
       growing the scrolling list (no ancestor transform can trap it). popup.js
       sets top/left/width from the row when it opens. */
    .value-tip {
      position: fixed;
      inset: auto;
      margin: 0;
      padding: 8px 10px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--accent-blue);
      background: var(--bg-elevated);
      border: 2px solid var(--accent-blue);
      border-radius: var(--radius-sm);
      box-shadow: 0 0 12px color-mix(in srgb, var(--accent-blue) calc(50% * var(--glow-strength)), transparent);
      word-break: break-all;
      user-select: all;
    }

    .btn-icon.danger {
      color: var(--accent-pink);
      background: color-mix(in srgb, var(--accent-pink) 10%, transparent);
    }

    .btn-icon.danger:hover:not(:disabled) {
      background: color-mix(in srgb, var(--accent-pink) 20%, transparent);
      box-shadow: var(--bglow-pink);
    }

    /* Footer + theme bar share one bottom bar */
    .footer-area { margin-top: auto; }

    .footer {
      padding: 8px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-note {
      font-size: 10px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .footer .btn {
      font-size: 10px;
      padding: 4px 10px;
      letter-spacing: 0.05em;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--bg-elevated);
      border: 1px solid var(--accent-blue);
      box-shadow: var(--bglow-blue);
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text);
      opacity: 0;
      transition: opacity var(--dur) ease, transform var(--dur) ease;
      pointer-events: none;
      white-space: nowrap;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Theme selector */
    .theme-bar {
      padding: 10px 20px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .theme-bar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .theme-bar .choice { font-size: 11px; }

    .theme-bar .dropdown-toggle {
      min-height: 36px;
      padding: 5px 10px;
      font-size: 13px;
    }

    /* Motion off (toggle or OS setting): stop the app's own keyframe animations.
       Transitions already collapse through var(--dur). */
    [data-motion="off"] .dot.active,
    [data-motion="off"] .endpoint-item { animation: none; }

    @media (prefers-reduced-motion: reduce) {
      .dot.active,
      .endpoint-item { animation: none; }
    }
  </style>
</head>
<body class="fx-grid">

  <div class="header fx-bar-top">
    <div class="logo">
      <div class="logo-icon" aria-hidden="true">{}</div>
      <div class="logo-text">JSON<span>tap</span></div>
    </div>
    <label class="switch a-pink">
      <input type="checkbox" id="masterToggle" aria-label="Capture JSON" />
      <span class="track"><span class="thumb"></span></span>
      <span class="toggle-label" id="toggleLabel" aria-hidden="true">OFF</span>
    </label>
  </div>

  <div class="status-bar">
    <div class="status-indicator">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">Idle — open DevTools to capture</span>
    </div>
    <div class="capture-count">
      <span id="captureCount">0</span> captured
    </div>
  </div>

  <div class="body">
    <label class="field-label" for="endpointInput">Endpoint Filters</label>
    <div class="add-row">
      <div class="input-wrap">
        <input class="input" type="text" id="endpointInput" placeholder="api.example.com/data or /endpoint" />
      </div>
      <button class="btn btn-solid a-pink" id="addBtn">+ Add</button>
    </div>
    <div class="endpoints-wrap fx-scroll" id="endpointList">
      <!-- populated by JS -->
    </div>
  </div>

  <div class="footer-area fx-bar-bottom">
    <div class="footer">
      <span class="footer-note">DevTools must be open to capture</span>
      <button class="btn btn-ghost" id="clearCountBtn">Reset count</button>
    </div>

    <div class="theme-bar">
      <div class="theme-bar-head">
        <label class="field-label" for="themeSelect">Theme</label>
        <label class="choice"><input type="checkbox" data-motion-toggle> Reduce motion</label>
      </div>
      <select id="themeSelect" data-theme-select data-dropdown></select>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="theme/theme-select.js"></script>
  <script src="theme/dropdown.js"></script>
  <script src="popup.js"></script>
</body>
</html>
